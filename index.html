<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>周辺視野リーチ訓練</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E7ECEF; --panel:#F6F8F9; --ink:#1E2934; --mute:#5B6875; --line:#C2CBD2;
  --signal:#E2A400; --fast:#2F6FD6; --miss:#C2453A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --paper:#151B21; --panel:#1D252D; --ink:#DCE3E8; --mute:#93A1AD; --line:#34414D; }
}
:root[data-theme="dark"]{ --paper:#151B21; --panel:#1D252D; --ink:#DCE3E8; --mute:#93A1AD; --line:#34414D; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.65 "IBM Plex Sans JP",system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:1080px;margin:0 auto;padding:28px 20px 48px;display:grid;gap:28px;
  grid-template-columns:minmax(0,1fr)}
@media (min-width:860px){ main{grid-template-columns:minmax(0,1fr) 380px} #history{grid-column:1 / -1} }
h1{font-size:1.9rem;line-height:1.25;margin:0 0 6px;font-weight:600;letter-spacing:.01em}
h2{font-size:1.1rem;margin:0 0 12px;font-weight:600}
p{margin:0 0 10px;max-width:62ch}
.lede{color:var(--mute)}
section{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px}
header{grid-column:1 / -1}
fieldset{border:0;margin:0 0 18px;padding:0}
legend{font-weight:600;margin-bottom:6px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:4px;
  padding:8px 12px;cursor:pointer;min-height:44px}
.opts label:has(input:checked){border-color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:16px}
.num label{display:block;font-weight:600}
.num input{width:120px;font:inherit;padding:8px;border:1px solid var(--line);border-radius:4px;
  background:var(--paper);color:var(--ink);min-height:44px}
.hint{font-size:.85rem;color:var(--mute)}
button{font:inherit;font-weight:600;border-radius:4px;cursor:pointer;min-height:44px;padding:10px 18px;
  border:1px solid var(--ink);background:transparent;color:var(--ink)}
button.primary{background:var(--ink);color:var(--paper);font-size:1.1rem;padding:14px 28px}
button:focus-visible,input:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
#xrstatus{margin-top:10px;font-size:.9rem;color:var(--mute)}
#chart svg{width:100%;height:auto;display:block}
